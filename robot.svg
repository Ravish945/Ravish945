<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Minimal robot buddy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .float  { animation: float 3.6s ease-in-out infinite; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 3.6s ease-in-out infinite; }
    .head   { transform-box: fill-box; transform-origin: 50% 100%; animation: tilt 7.2s ease-in-out infinite; }
    .glance { animation: glance 8s ease-in-out infinite; }
    .eye    { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
    .handL  { animation: bobL 3.6s ease-in-out infinite; }
    .handR  { animation: bobR 3.6s ease-in-out infinite; }

    @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .18; } 50% { transform: scaleX(.8); opacity: .10; } }
    @keyframes tilt   { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
    @keyframes glance { 0%,18%,50%,82%,100% { transform: translateX(0); } 26%,42% { transform: translateX(-6px); } 66%,76% { transform: translateX(6px); } }
    @keyframes blink  { 0%,91%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
    @keyframes bobL   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
    @keyframes bobR   { 0%,100% { transform: translateY(4px); } 50% { transform: translateY(-2px); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <ellipse class="shadow" cx="100" cy="182" rx="40" ry="5" fill="#8A8A85" opacity="0.18"/>

  <g class="float">
    <!-- floating hands -->
    <rect class="handL" x="12" y="104" width="14" height="30" rx="7" fill="#FAFAF8" stroke="#D6D6CF" stroke-width="2"/>
    <rect class="handR" x="174" y="104" width="14" height="30" rx="7" fill="#FAFAF8" stroke="#D6D6CF" stroke-width="2"/>

    <!-- head -->
    <g class="head">
      <rect x="34" y="44" width="132" height="104" rx="46" fill="#FAFAF8" stroke="#D6D6CF" stroke-width="2"/>
      <rect x="50" y="62" width="100" height="68" rx="34" fill="#111111"/>
      <g class="glance">
        <rect class="eye" x="76" y="86" width="12" height="20" rx="6" fill="#2D5BFF"/>
        <rect class="eye" x="112" y="86" width="12" height="20" rx="6" fill="#2D5BFF"/>
      </g>
    </g>
  </g>
</svg>
